<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Announcement Graphics · GoodPWR HR Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,ital,wght@6..96,0,700;6..96,1,600&family=Jost:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* GoodPWR HR Hub — shared styles. Change the brand color in one place: --accent. */
:root{
  --bg:#F3F3F1; --panel:#FFFFFF; --line:#DEDDD8; --ink:#1F2124; --muted:#6A6C70; --soft:#ECECE8;
  --accent:#2E7D4F; --accent-ink:#FFFFFF; --accent-soft:#E3F0E8; --danger:#B3261E; --warn:#9A6400;
  --f-display:"Bodoni Moda", "Didot", Georgia, serif;
  --f-body:"Jost", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:8px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
img{max-width:100%}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* top bar */
.hub-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hub-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.hub-brand img{height:30px;width:auto}
.hub-brand b{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.01em}
.hub-brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.hub-crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.hub-crumb strong{color:var(--ink);font-weight:600}
.hub-top .grow{flex:1}
.hub-private{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.hub-private::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 20px;margin-bottom:18px}
.page-head h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4vw,34px);line-height:1.1;margin:0;text-wrap:balance}
.page-head p{margin:0;color:var(--muted);max-width:62ch}
.replaces{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 10px;background:var(--panel)}
.cols{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
.cols.wide-left{grid-template-columns:400px minmax(0,1fr)}
@media (max-width:860px){.cols,.cols.wide-left{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 12px}
.panel + .panel{margin-top:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:480px){.grid2,.grid3{grid-template-columns:1fr}}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-size:13px}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}

/* form controls */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input[type=text],.field input[type=number],.field input[type=email],.field input[type=url],.field input[type=tel],.field input[type=date],.field input[type=time],
.field select,.field textarea,.input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.field textarea{min-height:90px;resize:vertical}
.field input[type=color]{width:100%;height:38px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--panel)}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 14px;line-height:1.2;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover:not(:disabled){background:var(--soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--danger)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;border-right:1px solid var(--line);background:transparent;padding:7px 12px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent);font-weight:600}

/* drop zone */
.drop{border:2px dashed var(--line);border-radius:var(--r);background:var(--panel);padding:28px 18px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{display:block;font-size:16px;margin-bottom:2px}
.drop .muted{font-size:13px}

/* file list */
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.files li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--panel);min-width:0}
.files li .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files li .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* stage for page previews */
.stage{background:#E4E4E0;border-radius:var(--r);padding:20px;overflow:auto;min-height:360px;display:flex;flex-direction:column;align-items:center;gap:20px}
.sheet{position:relative;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.16),0 8px 24px rgba(0,0,0,.10);flex:none}
.sheet canvas{display:block}
.empty-note{color:var(--muted);text-align:center;margin:auto;max-width:40ch}

.progress{height:6px;background:var(--soft);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0;font-size:13.5px}
.note.warn{border-color:var(--warn);background:#FBF1DE}
table.data{border-collapse:collapse;width:100%;font-size:13.5px}
table.data th,table.data td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
table.data th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scroll-x{overflow-x:auto}

.hub-toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:100}
.hub-toast.show{opacity:1}

</style>
<style>
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.tpls button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 6px;font-size:13px}
.tpls button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.canvas-wrap{background:#E4E4E0;border-radius:var(--r);padding:20px;display:flex;justify-content:center}
#cv{max-width:100%;max-height:72vh;width:auto;height:auto;box-shadow:0 8px 24px rgba(0,0,0,.14)}
#caption{min-height:110px}
</style>
</head>
<body>
<main class="wrap">
  <div class="page-head"><h1>Announcement Graphics</h1><span class="replaces">Instead of Canva Pro</span>
    <p>On-brand images for hiring posts, new-hire welcomes, holiday notices and work anniversaries, sized for every platform.</p></div>
  <div class="cols wide-left">
    <aside>
      <div class="panel stack">
        <h2>Template</h2>
        <div class="tpls" id="tpls"></div>
        <div class="field"><label for="fmt">Size</label>
          <select id="fmt"><option value="1080x1080">Square · Instagram, Facebook (1080×1080)</option><option value="1080x1350">Portrait · Instagram feed (1080×1350)</option><option value="1080x1920">Story · Instagram, Facebook (1080×1920)</option><option value="1200x627">LinkedIn post (1200×627)</option><option value="1920x1080">Slide or TV screen (1920×1080)</option></select></div>
        <div class="field"><label for="theme">Look</label>
          <select id="theme"><option value="dark">Charcoal</option><option value="brand">GoodPWR green</option><option value="light">Light</option></select></div>
      </div>
      <div class="panel stack">
        <h2>Text</h2>
        <div class="field"><label for="eyebrow">Small label</label><input type="text" id="eyebrow"></div>
        <div class="field"><label for="headline">Headline</label><textarea id="headline" style="min-height:60px"></textarea></div>
        <div class="field"><label for="body">Supporting text</label><textarea id="body" style="min-height:60px"></textarea></div>
        <div class="field"><label for="details">Details, one per line</label><textarea id="details" style="min-height:70px"></textarea></div>
        <div class="field"><label for="cta">Call to action</label><input type="text" id="cta"></div>
      </div>
      <div class="panel stack">
        <h2>Images</h2>
        <div class="drop" id="dropPhoto" style="padding:12px"><strong style="font-size:14px">Photo (optional)</strong><span class="muted">Shown in a circle, good for people</span></div>
        <div class="drop" id="dropLogo" style="padding:12px"><strong style="font-size:14px">Logo (optional)</strong><span class="muted">Shown in the corner</span></div>
        <div class="row"><button class="btn sm" id="clrPhoto">Remove photo</button><button class="btn sm" id="clrLogo">Remove logo</button></div>
      </div>
    </aside>
    <section class="stack">
      <div class="canvas-wrap"><canvas id="cv" width="1080" height="1080" aria-label="Graphic preview"></canvas></div>
      <div class="row"><button class="btn primary" id="png">Download PNG</button><button class="btn" id="jpg">Download JPG</button></div>
      <div class="panel stack">
        <div class="row between"><h2 style="margin:0">Suggested caption</h2><button class="btn sm" id="copyCap">Copy caption</button></div>
        <textarea id="caption" class="input"></textarea>
      </div>
    </section>
  </div>
</main>
<script>
/* GoodPWR HR Hub — shared helpers used by every tool. Nothing here stores or sends data anywhere. */
(function () {
  const LIBS = {
    pdfjs: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
    pdflib: 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js',
    fontkit: 'https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js',
    jszip: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
    papa: 'https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js',
    xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
    diff: 'https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.1.0/diff.min.js',
    tesseract: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js',
    qrcode: 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js',
    jsbarcode: 'https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js'
  };
  const PDF_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const loaded = {};

  const Hub = {
    company: { name: 'GoodPWR', site: 'getgoodpwr.com' },

    /** Load one or more libraries by key (see LIBS) or URL. Each loads once. */
    load(...keys) {
      return Promise.all(keys.map(k => {
        const url = LIBS[k] || k;
        if (!loaded[url]) loaded[url] = new Promise((res, rej) => {
          const s = document.createElement('script'); s.src = url; s.onload = res;
          s.onerror = () => rej(new Error('Could not load a required library. Check your internet connection and reload.'));
          document.head.appendChild(s);
        });
        return loaded[url];
      })).then(() => { if (window.pdfjsLib && !pdfjsLib.GlobalWorkerOptions.workerSrc) pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER; });
    },

    /** Tab icon: a dark rounded square with a green bar and a short code, so HR Hub tabs never look like the GoodPWR logo. */
    favicon(code) {
      const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
      x.fillStyle = '#1F2124'; x.beginPath(); x.roundRect ? x.roundRect(0, 0, 64, 64, 14) : x.rect(0, 0, 64, 64); x.fill();
      x.fillStyle = '#5FBF84'; x.fillRect(12, 50, 40, 5);
      x.fillStyle = '#FFFFFF'; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.font = `700 ${code.length > 2 ? 21 : 28}px Arial, Helvetica, sans-serif`; x.fillText(code, 32, 29);
      document.querySelectorAll('link[rel~="icon"]').forEach(l => l.remove());
      const l = document.createElement('link'); l.rel = 'icon'; l.type = 'image/png'; l.href = c.toDataURL('image/png'); document.head.appendChild(l);
    },
    ICONS: { 'pdf-editor': 'PE', 'form-builder': 'FF', 'sign-pdf': 'SI', 'pdf-compare': 'CP', 'ocr': 'OCR', 'bates-numbering': 'BN', 'mail-merge': 'MM',
      'certificate-designer': 'CD', 'social-graphics': 'AG', 'background-remover': 'BG', 'email-signature': 'ES', 'time-zones': 'TZ', 'label-maker': 'QR' },

    /** Insert the shared top bar. */
    mount(title) {
      const file = (location.pathname.split('/').pop() || '').replace(/\.html$/, '');
      Hub.favicon(Hub.ICONS[file] || 'HR');
      const home = './';
      const h = document.createElement('header'); h.className = 'hub-top';
      h.innerHTML = `<a class="hub-brand" href="${home}index.html"><img src="${home}logo.png" alt="" onerror="this.remove()"><b>GoodPWR</b><span>HR Hub</span></a>
        ${title ? `<span class="hub-crumb">/ <strong></strong></span>` : ''}<span class="grow"></span>
        <span class="hub-private" title="Files are processed in your browser and never uploaded">Files stay on your computer</span>`;
      if (title) h.querySelector('strong').textContent = title;
      document.body.prepend(h);
      if (title) document.title = title + ' · GoodPWR HR Hub';
    },

    toast(msg, ms = 2800) {
      let t = document.querySelector('.hub-toast');
      if (!t) { t = document.createElement('div'); t.className = 'hub-toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
      t.textContent = msg; t.classList.add('show'); clearTimeout(Hub._tt); Hub._tt = setTimeout(() => t.classList.remove('show'), ms);
    },

    /** Save a Blob/bytes/string as a file. */
    download(data, filename, type) {
      const blob = data instanceof Blob ? data : new Blob([data], { type: type || 'application/octet-stream' });
      const u = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 5000);
    },

    async zip(files, zipName) {
      await Hub.load('jszip');
      const z = new JSZip(); files.forEach(f => z.file(f.name, f.data));
      Hub.download(await z.generateAsync({ type: 'blob' }), zipName);
    },

    bytes: async f => new Uint8Array(await f.arrayBuffer()),
    dataURL: f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); }),
    loadImage: src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }),
    baseName: n => (n || 'file').replace(/\.[^.]+$/, ''),
    size: b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB',
    esc: s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),

    /** Make an element a click-or-drop file picker. */
    dropzone(el, { accept = '', multiple = false, onFiles }) {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = accept; inp.multiple = multiple; inp.hidden = true;
      el.after(inp); el.tabIndex = 0; el.setAttribute('role', 'button');
      const take = list => { const fs = [...list]; if (fs.length) onFiles(multiple ? fs : [fs[0]]); };
      el.addEventListener('click', () => inp.click());
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); inp.click(); } });
      inp.addEventListener('change', () => { take(inp.files); inp.value = ''; });
      el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
      el.addEventListener('dragleave', () => el.classList.remove('over'));
      el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('over'); take(e.dataTransfer.files); });
      return inp;
    },

    /** Open a PDF with pdf.js (keeps the original bytes intact). */
    async openPdf(bytes) {
      await Hub.load('pdfjs');
      try { return await pdfjsLib.getDocument({ data: bytes.slice(0) }).promise; }
      catch (e) { throw new Error(e && e.name === 'PasswordException' ? 'This PDF is password-protected. Remove the password first.' : 'That file could not be read as a PDF.'); }
    },

    /** Render a pdf.js page to a canvas at a given scale. */
    async renderPage(page, scale, canvas, rotation) {
      const vp = page.getViewport({ scale, rotation: rotation ?? page.rotate });
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas = canvas || document.createElement('canvas');
      canvas.width = Math.floor(vp.width * dpr); canvas.height = Math.floor(vp.height * dpr);
      canvas.style.width = vp.width + 'px'; canvas.style.height = vp.height + 'px';
      const ctx = canvas.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      return { canvas, viewport: vp };
    },

    hexRgb(h) { const n = parseInt((h || '#000000').slice(1), 16); return PDFLib.rgb(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255); },

    /** Make text safe for standard PDF fonts. */
    winAnsi: s => String(s || '').normalize('NFKC').replace(/₱/g, 'PHP ')
      .replace(/[^\n\x20-\x7E\xA0-\xFF‘’“”–—•€…]/g, '?'),

    /** Read a CSV or Excel file (or pasted CSV text) into { headers, rows:[{col:value}] }. */
    async readTable(fileOrText) {
      let rows;
      if (typeof fileOrText === 'string' || /\.(csv|txt|tsv)$/i.test(fileOrText.name)) {
        await Hub.load('papa');
        const text = typeof fileOrText === 'string' ? fileOrText : await fileOrText.text();
        rows = Papa.parse(text.trim(), { header: true, skipEmptyLines: true, transformHeader: h => h.trim() }).data;
      } else {
        await Hub.load('xlsx');
        const wb = XLSX.read(await fileOrText.arrayBuffer(), { type: 'array', cellDates: true });
        rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '', raw: false });
      }
      rows = rows.filter(r => Object.values(r).some(v => String(v).trim()));
      const headers = rows.length ? Object.keys(rows[0]).filter(h => h && !/^__EMPTY/.test(h)) : [];
      return { headers, rows };
    },

    /** Wrap text into lines that fit a width with a pdf-lib font. */
    wrap(text, font, size, maxW) {
      const out = [];
      String(text).split('\n').forEach(par => {
        if (!par.trim()) { out.push(''); return; }
        let line = '';
        par.split(/(\s+)/).forEach(tok => {
          const test = line + tok;
          if (font.widthOfTextAtSize(test.trimEnd(), size) <= maxW || !line.trim()) line = test;
          else { out.push(line.trimEnd()); line = tok.trimStart(); }
        });
        out.push(line.trimEnd());
      });
      return out;
    },

    /** Make a small working state for a tool when there is nothing loaded yet. */
    async samplePdf(lines, title) {
      await Hub.load('pdflib');
      const { PDFDocument, StandardFonts, rgb } = PDFLib;
      const d = await PDFDocument.create(), f = await d.embedFont(StandardFonts.Helvetica), fb = await d.embedFont(StandardFonts.HelveticaBold);
      const p = d.addPage([612, 792]);
      p.drawText(title, { x: 72, y: 700, size: 20, font: fb, color: rgb(.12, .13, .15) });
      lines.forEach((l, i) => p.drawText(l, { x: 72, y: 660 - i * 22, size: 11, font: f, color: rgb(.12, .13, .15) }));
      return await d.save();
    }
  };
  window.Hub = Hub;
})();

</script>
<script>
Hub.mount('Announcement Graphics');
const $ = id => document.getElementById(id);
const T = {
  hiring: { label: "We're hiring", eyebrow: 'Join the team', headline: "We're hiring:\nSolar Installer", body: 'Help homes and businesses switch to clean energy. Full training provided.', details: 'Full-time, on site\nCompetitive hourly pay + benefits\nPaid training and certifications', cta: 'Apply at getgoodpwr.com/careers',
    cap: "We're growing! GoodPWR is hiring a {role}. If you love hands-on work and want to build a career in clean energy, we want to hear from you.\n\nApply: getgoodpwr.com/careers\n\n#Hiring #SolarJobs #CleanEnergy #GoodPWR" },
  welcome: { label: 'Welcome', eyebrow: 'New team member', headline: 'Welcome aboard,\nPriya Shah!', body: 'Priya joins us as Project Coordinator and will keep our installs running on time.', details: '', cta: 'Say hi when you see her!',
    cap: "Please join us in welcoming {name} to the GoodPWR team! We're glad to have you.\n\n#Welcome #NewHire #TeamGoodPWR" },
  anniv: { label: 'Anniversary', eyebrow: 'Work anniversary', headline: '5 years with GoodPWR', body: 'Thank you, Marco, for five years of great work and leadership on every site.', details: '', cta: 'Congratulations, Marco!',
    cap: "Happy work anniversary, {name}! Thank you for everything you bring to the team.\n\n#WorkAnniversary #TeamGoodPWR" },
  holiday: { label: 'Holiday', eyebrow: 'Office notice', headline: 'Happy Thanksgiving', body: 'Our offices will be closed so our team can spend time with family.', details: 'Closed: Thursday, Nov 26 – Friday, Nov 27\nBack: Monday, Nov 30', cta: 'For urgent service, call our support line.',
    cap: "Happy Thanksgiving from all of us at GoodPWR! Our office is closed Nov 26–27 and reopens Monday, Nov 30.\n\n#HappyThanksgiving #GoodPWR" },
  news: { label: 'Announcement', eyebrow: 'Company news', headline: 'Open enrollment\nstarts Monday', body: 'Review your health, dental and vision options for next year.', details: 'Window: Nov 2 – Nov 16\nQuestions? Ask HR anytime', cta: 'Check your email for the guide',
    cap: "Reminder: open enrollment starts Monday and runs through Nov 16. Check your email for the benefits guide, and reach out to HR with any questions." },
  safety: { label: 'Safety', eyebrow: 'Safety first', headline: '100 days\nwithout an incident', body: 'Thanks to every crew for looking out for each other.', details: '', cta: "Let's keep it going!",
    cap: "100 days without a safety incident! Thank you to every crew member for making safety a habit.\n\n#SafetyFirst #TeamGoodPWR" }
};
const THEMES = { dark: { bg: '#1F2124', bg2: '#2A2D31', ink: '#FFFFFF', sub: '#C9CBC6', acc: '#5FBF84' }, brand: { bg: '#2E7D4F', bg2: '#276B43', ink: '#FFFFFF', sub: '#DDEFE3', acc: '#F3D36B' }, light: { bg: '#F3F3F1', bg2: '#E7E7E3', ink: '#1F2124', sub: '#55585C', acc: '#2E7D4F' } };
let key = 'hiring', photo = null, logo = null;
$('tpls').innerHTML = Object.entries(T).map(([k, t]) => `<button data-k="${k}" aria-pressed="${k === key}">${t.label}</button>`).join('');
function load(k) { key = k; ['eyebrow', 'headline', 'body', 'details', 'cta'].forEach(f => $(f).value = T[k][f]); $('tpls').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === k)); render(); }
$('tpls').onclick = e => { const b = e.target.closest('button'); if (b) load(b.dataset.k); };

function lines(ctx, text, maxW) {
  const out = []; text.split('\n').forEach(par => { let l = ''; par.split(' ').forEach(w => { const t = l ? l + ' ' + w : w; if (ctx.measureText(t).width > maxW && l) { out.push(l); l = w; } else l = t; }); out.push(l); }); return out;
}
const ready = Promise.all(['700 80px "Bodoni Moda"', '400 30px Jost', '600 30px Jost', '700 30px Jost'].map(f => document.fonts.load(f)));
async function render() {
  await ready;
  const [W, H] = $('fmt').value.split('x').map(Number), c = $('cv'); c.width = W; c.height = H;
  const ctx = c.getContext('2d'), th = THEMES[$('theme').value], u = Math.min(W, H) / 1080, wide = W / H > 1.4;
  // background
  ctx.fillStyle = th.bg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = th.bg2; ctx.beginPath(); ctx.arc(W * 1.02, H * -.02, Math.max(W, H) * .5, 0, 7); ctx.fill();
  ctx.strokeStyle = th.acc; ctx.globalAlpha = .35; ctx.lineWidth = 3 * u;
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(W * 1.02, H * -.02, Math.max(W, H) * (.56 + i * .07), 0, 7); ctx.stroke(); }
  ctx.globalAlpha = 1;
  const pad = 90 * u; let x = pad, y = pad, maxW = W - pad * 2;
  // photo
  if (photo) {
    const r = (wide ? H * .28 : 150 * u), px = wide ? W - pad - r : W - pad - r, py = wide ? H / 2 : pad + r + 40 * u;
    ctx.save(); ctx.beginPath(); ctx.arc(px, py, r, 0, 7); ctx.clip();
    const s = Math.max(2 * r / photo.width, 2 * r / photo.height); ctx.drawImage(photo, px - photo.width * s / 2, py - photo.height * s / 2, photo.width * s, photo.height * s); ctx.restore();
    ctx.strokeStyle = th.acc; ctx.lineWidth = 8 * u; ctx.beginPath(); ctx.arc(px, py, r + 6 * u, 0, 7); ctx.stroke();
    if (wide) maxW = W - pad * 2 - r * 2 - 60 * u; else y = py + r + 70 * u;
  }
  // logo
  if (logo) { const s = Math.min(70 * u / logo.height, 260 * u / logo.width); ctx.drawImage(logo, pad, H - pad - logo.height * s, logo.width * s, logo.height * s); }
  else { ctx.fillStyle = th.ink; ctx.font = `700 ${34 * u}px "Bodoni Moda"`; ctx.textBaseline = 'alphabetic'; ctx.fillText('GoodPWR', pad, H - pad); }
  if (!photo || wide) y = wide ? pad + 20 * u : Math.max(pad + 60 * u, H * .2);
  ctx.textBaseline = 'top';
  // eyebrow
  const eb = $('eyebrow').value.toUpperCase();
  if (eb) { ctx.font = `600 ${26 * u}px Jost`; ctx.letterSpacing = `${4 * u}px`; const w = ctx.measureText(eb).width;
    ctx.fillStyle = th.acc; ctx.fillRect(x, y + 12 * u, 36 * u, 4 * u); ctx.fillText(eb, x + 52 * u, y); ctx.letterSpacing = '0px'; y += 64 * u; }
  // headline (shrink to fit)
  let hs = (wide ? 84 : 96) * u, hl;
  for (; hs > 36 * u; hs -= 4 * u) { ctx.font = `700 ${hs}px "Bodoni Moda"`; hl = lines(ctx, $('headline').value, maxW); if (hl.length * hs * 1.08 < H * (wide ? .42 : .36)) break; }
  ctx.fillStyle = th.ink; hl.forEach(l => { ctx.fillText(l, x, y); y += hs * 1.08; }); y += 26 * u;
  // body
  if ($('body').value) { ctx.font = `400 ${32 * u}px Jost`; ctx.fillStyle = th.sub; lines(ctx, $('body').value, maxW).forEach(l => { ctx.fillText(l, x, y); y += 44 * u; }); y += 20 * u; }
  // details
  const det = $('details').value.split('\n').filter(s => s.trim());
  if (det.length) { ctx.font = `500 ${30 * u}px Jost`; det.forEach(d => { ctx.fillStyle = th.acc; ctx.beginPath(); ctx.arc(x + 9 * u, y + 19 * u, 7 * u, 0, 7); ctx.fill(); ctx.fillStyle = th.ink; lines(ctx, d, maxW - 36 * u).forEach((l, i) => { ctx.fillText(l, x + 34 * u, y); y += 42 * u; }); y += 6 * u; }); y += 14 * u; }
  // cta pill
  const cta = $('cta').value;
  if (cta) { ctx.font = `600 ${28 * u}px Jost`; const w = Math.min(ctx.measureText(cta).width + 56 * u, maxW), h = 64 * u, cy = Math.min(y + 10 * u, H - pad - 140 * u);
    ctx.fillStyle = th.acc; roundRect(ctx, x, cy, w, h, h / 2); ctx.fill(); ctx.fillStyle = $('theme').value === 'light' ? '#fff' : '#1F2124'; ctx.textBaseline = 'middle'; ctx.fillText(cta, x + 28 * u, cy + h / 2, maxW - 56 * u); }
  caption();
}
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function caption() {
  const h = $('headline').value.replace(/\n/g, ' '), name = (h.match(/,\s*([^!]+)!?$/) || [])[1] || 'our newest teammate', role = (h.split(':')[1] || 'new team member').trim();
  $('caption').value = T[key].cap.replace('{name}', name.trim()).replace('{role}', role);
}
document.querySelectorAll('aside input, aside textarea').forEach(el => el.addEventListener('input', render));
$('fmt').onchange = render; $('theme').onchange = render;
Hub.dropzone($('dropPhoto'), { accept: 'image/*', onFiles: async ([f]) => { photo = await Hub.loadImage(await Hub.dataURL(f)); render(); } });
Hub.dropzone($('dropLogo'), { accept: 'image/*', onFiles: async ([f]) => { logo = await Hub.loadImage(await Hub.dataURL(f)); render(); } });
$('clrPhoto').onclick = () => { photo = null; render(); }; $('clrLogo').onclick = () => { logo = null; render(); };
const fname = ext => `${T[key].label.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-${$('fmt').value}.${ext}`;
$('png').onclick = () => $('cv').toBlob(b => Hub.download(b, fname('png')), 'image/png');
$('jpg').onclick = () => $('cv').toBlob(b => Hub.download(b, fname('jpg')), 'image/jpeg', .92);
$('copyCap').onclick = async () => { try { await navigator.clipboard.writeText($('caption').value); Hub.toast('Caption copied.'); } catch (e) { $('caption').select(); Hub.toast('Press Ctrl+C to copy.'); } };
load('hiring');
</script>
</body>
</html>
